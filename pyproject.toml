[project]
name = "gigachat-cli"
dynamic = ["version"]
description = "GigaChat CLI utility"
authors = [
    {name = "THEChrismoth", email = "klevindanila@ya.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain-gigachat>=0.3.12",
    # На Python 3.14 SDK GigaChat (pydantic.v1) с pydantic 2.12 падает с ошибкой
    # 'unable to infer type for attribute "x_headers"'
    "pydantic>=2.13; python_version >= '3.14'",
    "textual>=6.2.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
    "Topic :: Terminals",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff==0.17.2",
]

[project.scripts]
gigachat = "gigachat_cli.__main__:main"

[project.urls]
Homepage = "https://github.com/THEChrismoth/GigaChat-Cli"
Repository = "https://github.com/THEChrismoth/GigaChat-Cli"
Documentation = "https://github.com/THEChrismoth/GigaChat-Cli/blob/master/README.md"
"Issue Tracker" = "https://github.com/THEChrismoth/GigaChat-Cli/issues"

[build-system]
requires = ["setuptools>=45", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools_scm]
version_scheme = "release-branch-semver"
local_scheme = "node-and-timestamp"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# Базовый набор: синтаксические ошибки, неопределенные имена, неиспользуемые импорты
select = ["E4", "E7", "E9", "F"]
