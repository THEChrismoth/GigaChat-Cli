# Публикация пакета в PyPI при создании релиза.
# Пакет собирается и публикуется только после успешного прохождения тестов.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  release-build:
    runs-on: ubuntu-latest
    needs:
      - tests

    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история с тегами нужна setuptools-scm для вычисления версии пакета
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Build release distributions
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/gigachat-cli

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # Дублирование релиза на GitVerse: пуш тега, создание релиза и загрузка дистрибутивов.
  # Требуется секрет GITVERSE_TOKEN (токен GitVerse с доступом к репозиториям на запись)
  gitverse-release:
    runs-on: ubuntu-latest
    needs:
      - release-build
    env:
      GITVERSE_REPO: THEChrismoth/GigaChat-Cli
      GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
      TAG: ${{ github.event.release.tag_name }}
      RELEASE_NAME: ${{ github.event.release.name }}
      RELEASE_BODY: ${{ github.event.release.body }}
      PRERELEASE: ${{ github.event.release.prerelease }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Тег пушится и здесь: релиз на GitVerse создается по тегу, и ждать workflow зеркалирования нельзя.
      # Ветки зеркалирует mirror-gitverse.yml
      - name: Push tag to GitVerse
        run: |
          if [ -z "$GITVERSE_TOKEN" ]; then
            echo "::error::Секрет GITVERSE_TOKEN не задан"
            exit 1
          fi
          auth=$(printf '%s:%s' "${GITVERSE_REPO%%/*}" "$GITVERSE_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git config --local http.https://gitverse.ru/.extraheader "Authorization: Basic $auth"
          git remote add gitverse "https://gitverse.ru/$GITVERSE_REPO.git"

          git push gitverse "refs/tags/$TAG:refs/tags/$TAG"

      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Create GitVerse release and upload assets
        run: |
          set -euo pipefail
          api="https://api.gitverse.ru/repos/$GITVERSE_REPO"
          headers=(-H "Authorization: Bearer $GITVERSE_TOKEN" -H "Accept: application/vnd.gitverse.object+json;version=1")

          # Повторный запуск не создает дубликат: сначала ищем релиз по тегу
          status=$(curl -sS -o release.json -w '%{http_code}' "${headers[@]}" "$api/releases/tags/$TAG")
          if [ "$status" = "404" ]; then
            jq -n --arg tag "$TAG" --arg name "${RELEASE_NAME:-$TAG}" --arg body "$RELEASE_BODY" --argjson pre "$PRERELEASE" \
              '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: $pre}' > payload.json
            curl -sS --fail-with-body "${headers[@]}" -H "Content-Type: application/json" \
              --data @payload.json -o release.json "$api/releases"
          elif [ "$status" != "200" ]; then
            echo "::error::Ошибка получения релиза GitVerse (HTTP $status)"
            cat release.json
            exit 1
          fi
          release_id=$(jq -r '.id' release.json)

          upload() {
            curl -sS --fail-with-body "${headers[@]}" -F "attachment=@$1" "$api/releases/$release_id/assets?name=$2"
          }

          uploaded() {
            jq -e --arg name "$1" '(.assets // []) | any(.name == $name)' release.json > /dev/null
          }

          for file in dist/*; do
            name=$(basename "$file")
            fallback="${name%.tar.gz}.tgz"
            if uploaded "$name" || uploaded "$fallback"; then
              echo "Файл $name уже загружен"
              continue
            fi
            if upload "$file" "$name"; then
              :
            elif [[ "$name" == *.tar.gz ]]; then
              # .tar.gz нет в явном списке разрешенных форматов GitVerse - при отказе загружаем как .tgz
              upload "$file" "$fallback"
            else
              exit 1
            fi
            echo
          done
